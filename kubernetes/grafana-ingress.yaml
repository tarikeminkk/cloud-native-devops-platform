apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: default
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - grafana.kubeops.local
      secretName: grafana-tls

  rules:
    - host: grafana.kubeops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-external
                port:
                  number: 3000
