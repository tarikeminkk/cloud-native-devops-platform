apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: default
spec:
  secretName: grafana-tls
  duration: 2160h
  renewBefore: 360h
  commonName: grafana.kubeops.local
  dnsNames:
    - grafana.kubeops.local
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer
