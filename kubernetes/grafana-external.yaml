apiVersion: v1
kind: Service
metadata:
  name: grafana-external
  namespace: default
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000

---
apiVersion: v1
kind: Endpoints
metadata:
  name: grafana-external
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.5.6
    ports:
      - name: http
        port: 3000
        protocol: TCP
