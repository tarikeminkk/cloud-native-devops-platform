apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-app-tls
  namespace: default
spec:
  secretName: demo-app-tls
  duration: 2160h
  renewBefore: 360h
  commonName: demo.kubeops.local
  dnsNames:
    - demo.kubeops.local
  issuerRef:
    name: lab-ca-issuer
    kind: ClusterIssuer
