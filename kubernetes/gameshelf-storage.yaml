apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gameshelf-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gameshelf-postgres-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gameshelf-local

  local:
    path: /var/lib/gameshelf-postgres

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tarik-k8s-wrk01

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gameshelf-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gameshelf-local
  resources:
    requests:
      storage: 10Gi
